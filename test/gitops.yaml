apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-config
  namespace: orphan-repro
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "1"
data:
  message: "survives both versions"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: orphan-repro
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
        app.kubernetes.io/part-of: orphan-repro
    spec:
      containers:
        - name: keeper
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orphan-reporter
  namespace: orphan-repro
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "1"
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: orphan-repro
        spec:
          restartPolicy: Never
          containers:
            - name: reporter
              image: busybox:1.36
              command: ["sh", "-c", "echo \"still running at $(date -u), removed from git\""]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-repro-view
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: default
    namespace: orphan-repro
