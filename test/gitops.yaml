apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-config
  namespace: orphan-repro
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "2"
data:
  message: "survives both versions"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: orphan-repro
  labels:
    app.kubernetes.io/part-of: orphan-repro
    demo.portainer.io/stack-version: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
        app.kubernetes.io/part-of: orphan-repro
    spec:
      containers:
        - name: keeper
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
